
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codex Collab - High-Performance Collaborative IDE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050507;
            --bg-surface: #0e0e12;
            --accent-primary: #6366f1;
            --accent-secondary: #06b6d4;
            --vh: 1vh;
        }
        body {
            background-color: var(--bg-deep);
            color: #f8fafc;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            /* Removed overflow: hidden from body to allow container-based scrolling */
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace !important;
        }
        .glass {
            background: rgba(14, 14, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        @media (max-width: 768px) {
            input, textarea, select {
                font-size: 16px !important; /* Prevents iOS zoom */
            }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }
        
        /* Ensure specific containers are scrollable */
        .scroll-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
    <script>
        const setVh = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', setVh);
        window.addEventListener('orientationchange', setVh);
        setVh();
    </script>
<script type="importmap">
{

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.0"
  }
}
</script>
</head>
<body class="overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
